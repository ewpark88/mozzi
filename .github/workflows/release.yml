# 릴리즈 빌드: vX.Y.Z 태그 push 시 prod AAB 를 서명 빌드해 아티팩트로 올린다.
# Play Console 업로드 단계는 P10 에서 활성화한다. 규칙: docs/BUILD_RELEASE.md §7
#
# 필요한 GitHub Secrets:
#   ANDROID_KEYSTORE_BASE64  업로드 키스토어(.jks)를 base64 인코딩한 값
#   ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD / ANDROID_STORE_PASSWORD
name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install openpyxl
      - run: flutter pub get

      - name: Verify
        run: bash tool/verify.sh

      - name: Check tag matches pubspec version
        run: |
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          if [ "v$PUBSPEC_VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} != pubspec v$PUBSPEC_VERSION"; exit 1
          fi

      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "서명 키 Secrets 없음"; exit 1; fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          storePassword=$ANDROID_STORE_PASSWORD
          EOF

      - name: Build prod AAB
        run: >
          flutter build appbundle --flavor prod --release
          -t lib/main_prod.dart
          --dart-define-from-file=config/prod.json
          --obfuscate --split-debug-info=build/symbols

      - uses: actions/upload-artifact@v4
        with:
          name: mozzi-${{ github.ref_name }}
          path: |
            build/app/outputs/bundle/prodRelease/*.aab
            build/symbols/
