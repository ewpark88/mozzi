# PR·main push 품질 게이트. 로컬 tool/verify.sh 와 같은 단계를 실행한다.
# 규칙: docs/BUILD_RELEASE.md §6
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install python deps
        run: pip install openpyxl

      - name: Pub get
        run: flutter pub get

      - name: Verify (format / analyze / architecture / balance / test)
        run: bash tool/verify.sh

      - name: Build dev debug APK
        run: >
          flutter build apk --flavor dev --debug
          -t lib/main_dev.dart
          --dart-define-from-file=config/dev.json
