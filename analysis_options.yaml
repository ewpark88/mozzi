# 정적 분석 규칙. docs/CODING_RULES.md 참조.
# 규칙을 끄려면 DECISIONS.md에 사유를 남기고 여기서만 끈다 (파일 단위 ignore 남용 금지).
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_return: error
    missing_required_param: error
    unused_import: error
    dead_code: warning
    todo: ignore
  exclude:
    - build/**
    - "**/*.g.dart"

linter:
  rules:
    # 공개 API 문서화는 domain/ 에서만 강제하고(리뷰 규칙), 전체 강제는 끈다.
    public_member_api_docs: false
    # 한국어 주석/문자열 사용을 위해 끈다.
    lines_longer_than_80_chars: false
